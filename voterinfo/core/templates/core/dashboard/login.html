{% extends "core/base.html" %}
{% block content %}
<section class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-5">
      <div class="gov-card p-4 p-md-5">
        <h4 class="text-center mb-4"><i class="bi bi-shield-lock-fill"></i> Admin Dashboard Login</h4>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            {{ form.username }}
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            {{ form.password }}
          </div>
          {% if form.errors %}
          <div class="text-danger small mb-3"><i class="bi bi-exclamation-circle"></i> Invalid username or password.</div>
          {% endif %}
          <button type="submit" class="btn btn-gov-primary btn-lg w-100"><i class="bi bi-box-arrow-in-right"></i> Login</button>
        </form>
        <p class="text-center text-muted small mt-3 mb-0">
          Create a staff account with: <code>python manage.py createsuperuser</code>
        </p>
      </div>
    </div>
  </div>
</section>
{% endblock %}
